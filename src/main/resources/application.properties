spring.application.name=interview-prep
spring.jpa.open-in-view=false

# Required: at least 32 bytes, supplied through the environment (never committed).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry=15m

# Optional: creates the first ADMIN on startup when both are set. Registration only ever creates USERs.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

spring.data.web.pageable.max-page-size=100
